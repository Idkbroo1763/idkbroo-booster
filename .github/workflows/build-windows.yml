name: Build Windows application
run-name: SoundLift V1.1.0 letöltése

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main, licensing-foundation]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build SoundLift.exe
        shell: powershell
        env:
          SOUNDLIFT_LOG_API_URL: ${{ secrets.SOUNDLIFT_LOG_API_URL }}
          SOUNDLIFT_LOG_ANON_KEY: ${{ secrets.SOUNDLIFT_LOG_ANON_KEY }}
        run: .\build-windows.ps1

      - name: Build installer
        shell: powershell
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc '.\installer.iss'

      - name: Create SHA-256 checksums
        shell: powershell
        run: |
          $files = @('dist\SoundLift.exe', 'dist\SoundLift Setup.exe', 'dist\SoundLift.ico')
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -LiteralPath 'dist\SHA256SUMS.txt' -Encoding ascii

      - name: Upload Windows files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SoundLift V1.1.0 letöltése
          path: |
            dist/SoundLift.exe
            dist/SoundLift Setup.exe
            dist/SoundLift.ico
            dist/SHA256SUMS.txt
            TELEPÍTÉS.txt
          if-no-files-found: error
